# nginx 反向代理示例：HTTPS 终结后转给本机的 nfmonitor server（-behind-proxy）。
# 证书可用 certbot 申请；把 nfm.example.com 换成你的域名。
server {
    listen 80;
    server_name nfm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nfm.example.com;

    ssl_certificate     /etc/letsencrypt/live/nfm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nfm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;

    # 建议再限制来源 IP，只允许办公网 / VPN 访问：
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖（而不是追加），客户端伪造的 X-Forwarded-For 不会被采信
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
