# 服务器版部署示例（见 README「服务器版」）。
#
# 1. 生成主密钥（放在数据卷之外，容器用户 65532 只读）：
#      mkdir -p secrets && docker run --rm nfmonitor genkey > secrets/master.key
#      sudo chown 65532:65532 secrets/master.key && sudo chmod 400 secrets/master.key
# 2. 创建管理员账号：
#      docker compose run --rm -it nfmonitor user add admin -role admin
# 3. 启动：docker compose up -d
# 4. 在宿主机上用 nginx / Caddy 做 HTTPS 反向代理到 127.0.0.1:8787（见 packaging/nginx-nfmonitor.conf）。
services:
  nfmonitor:
    build: .
    image: nfmonitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"   # 只给本机的反向代理用，不要直接暴露
    volumes:
      - nfmonitor-data:/data
    environment:
      NFMONITOR_MASTER_KEY_FILE: /run/secrets/nfmonitor_master_key
      # 反向代理用的域名与访问地址不同时加上，例如：
      # NFMONITOR_ALLOWED_ORIGINS: https://nfm.example.com
    secrets:
      - nfmonitor_master_key
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  nfmonitor-data:

secrets:
  nfmonitor_master_key:
    file: ./secrets/master.key
